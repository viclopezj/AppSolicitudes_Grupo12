[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# Generador de código para Room (debe calzar con Kotlin 2.2.10)
ksp = "2.3.6"
# DECISIÓN DEL EQUIPO: usamos Room 3 (la versión más moderna) en vez de Room 2.x.
# Por qué: Room 2.x está en modo mantenimiento (sin novedades) y Room 3 es la línea
# que seguirá evolucionando. Así el proyecto nace con la versión vigente.
# Futuro posible: Room 3 está pensado para Kotlin Multiplatform, por lo que la base
# de datos podría reutilizarse si la app se lleva a otras plataformas.
# Ojo: usa "androidx.room3.*" (no "androidx.room.*" como las guías antiguas).
room3 = "3.0.3"
# Motor SQLite que usará Room (en Room 3 es obligatorio indicar uno)
sqlite = "2.7.0"
# Navegación entre pantallas
navigationCompose = "2.9.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Room: Entity, DAO y Database. Guarda las solicitudes en el teléfono
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
# Room: genera el código de las anotaciones al compilar (@Dao, @Entity...)
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
# Driver SQLite que Room 3 exige. Trae su propio SQLite, así la base de datos
# se comporta igual en cualquier teléfono (y en otras plataformas a futuro)
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# Navegar entre pantallas (NavHost y NavController)
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Obtener el ViewModel desde las pantallas con viewModel()
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
# Íconos básicos de Material (Add, ArrowBack...). Material3 ya no los incluye solo.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Activa KSP en el proyecto
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
